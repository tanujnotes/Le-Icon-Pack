plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.tanujnotes.leiconpack'
    compileSdk {
        version = release(37) {
            it.minorApiLevel = 2
        }
    }

    defaultConfig {
        applicationId "com.tanujnotes.leiconpack"
        minSdk 26
        targetSdk 37
        versionCode 11
        versionName "v1.0.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

/**
 * Launchers read the icon pack's appfilter, theme_resources and themecfg either from res/xml or
 * from assets. res/xml is the single source of truth; the assets copies are generated at build time
 * so the two can never drift apart.
 */
abstract class CopyIconPackXmlToAssets extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract ConfigurableFileCollection getSources()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @Inject
    abstract FileSystemOperations getFs()

    @TaskAction
    void copy() {
        fs.sync {
            from(sources)
            into(outputDir)
        }
    }
}

def iconPackAssets = tasks.register('copyIconPackXmlToAssets', CopyIconPackXmlToAssets) {
    sources.from(
            'src/main/res/xml/appfilter.xml',
            'src/main/res/xml/theme_resources.xml',
            'src/main/res/xml/themecfg.xml'
    )
}

// IconPackResourcesTest reads the icon pack XML and drawables straight from disk, so tell Gradle
// about them: otherwise a change to appfilter.xml alone leaves the test task UP-TO-DATE.
tasks.withType(Test).configureEach {
    inputs.dir('src/main/res').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir('src/main/assets').withPathSensitivity(PathSensitivity.RELATIVE)
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(iconPackAssets) { it.outputDir }
    }
}

